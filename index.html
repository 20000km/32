<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3분 데이트 코스 | 지역별 맞춤 데이트 플래너</title>
  <meta name="description" content="서울, 부산, 제주 등 전국 18개 지역의 맞춤 데이트 코스를 3분 안에 완성해드립니다." />
  <meta name="keywords" content="데이트코스, 커플여행, 데이트장소, 서울데이트, 부산데이트, 제주데이트" />
  <meta property="og:title" content="3분 데이트 코스 플래너" />
  <meta property="og:description" content="지역과 분위기만 선택하면 3분 안에 완성되는 맞춤 데이트 코스" />
  <meta property="og:type" content="website" />

  <!-- Google AdSense: 아래 ca-pub-XXXXXXXXXXXXXXXX 를 본인 AdSense Publisher ID로 교체하세요 -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #e8739a;
      --pink-light: #ffb6c1;
      --dark: #1a1a2e;
      --dark-hover: #252548;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --text-hint: #9ca3af;
      --bg: #f9f7f5;
      --bg-card: #ffffff;
      --bg-surface: #f3f4f6;
      --border: rgba(0,0,0,0.1);
      --border-md: rgba(0,0,0,0.18);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --amber-text: #a07820;
      --amber-bg: rgba(250,200,100,0.1);
      --amber-border: rgba(250,200,100,0.25);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: var(--dark);
      padding: 3.5rem 1.5rem 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -80px; left: -80px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(255,182,193,0.07);
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -50px; right: -50px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,182,193,0.05);
    }
    .hero-tag {
      display: inline-block;
      background: rgba(255,182,193,0.15);
      color: var(--pink-light);
      font-size: 11px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 20px;
      border: 0.5px solid rgba(255,182,193,0.3);
      margin-bottom: 1.25rem;
      text-transform: uppercase;
    }
    .hero h1 {
      font-family: 'Noto Serif KR', serif;
      color: #fff;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }
    .hero h1 span { color: var(--pink-light); }
    .hero p { color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 300; }
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,182,193,0.1);
      color: var(--pink-light);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-top: 1.25rem;
      border: 0.5px solid rgba(255,182,193,0.2);
    }

    /* ── AD SLOTS ── */
    .ad-slot {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    .ad-slot-inner {
      background: var(--bg-surface);
      border: 0.5px dashed var(--border-md);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-hint);
      min-height: 90px;
      margin: 1.25rem 0;
    }

    /* ── MAIN ── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-hint);
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    /* ── SEARCH ── */
    .search-wrap {
      position: relative;
      margin-bottom: 0.75rem;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      stroke: var(--text-hint);
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border-md);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--pink); }
    .search-wrap input::placeholder { color: var(--text-hint); }

    /* ── SELECTED TAG ── */
    .selected-tag {
      display: none;
      margin-bottom: 0.75rem;
    }
    .selected-tag-inner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232,115,154,0.1);
      color: var(--pink);
      border: 0.5px solid rgba(232,115,154,0.3);
      border-radius: 20px;
      font-size: 12px;
      padding: 4px 12px;
    }
    .selected-tag-inner button {
      background: none;
      border: none;
      color: var(--pink);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0;
    }

    /* ── REGION GRID ── */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1.5rem;
      max-height: 280px;
      overflow-y: auto;
    }
    @media (max-width: 400px) {
      .region-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .region-btn {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 0.5rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .region-btn:hover { border-color: var(--pink-light); background: rgba(255,182,193,0.04); }
    .region-btn.active { border-color: var(--pink); background: rgba(232,115,154,0.06); }
    .region-btn .r-emoji { font-size: 22px; display: block; margin-bottom: 4px; }
    .region-btn .r-name { font-size: 12px; font-weight: 500; color: var(--text); display: block; }
    .region-btn .r-sub { font-size: 10px; color: var(--text-hint); display: block; margin-top: 1px; }
    .region-btn.active .r-name { color: var(--pink); }
    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      font-size: 13px;
      color: var(--text-hint);
    }

    /* ── OPTIONS ── */
    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .option-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .option-group select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border-md);
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .option-group select:focus { border-color: var(--pink); }

    /* ── VIBE CHIPS ── */
    .vibe-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .vibe-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      border: 0.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
    }
    .vibe-chip:hover { border-color: var(--pink-light); color: var(--pink); }
    .vibe-chip.active { background: var(--pink); border-color: var(--pink); color: white; font-weight: 500; }

    /* ── GENERATE BUTTON ── */
    .generate-btn {
      width: 100%;
      padding: 1rem;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .generate-btn:hover { background: var(--dark-hover); }
    .generate-btn:active { transform: scale(0.99); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── LOADING ── */
    .loading-state {
      display: none;
      text-align: center;
      padding: 2.5rem;
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
    }
    .loading-state.visible { display: block; }
    .pulse-hearts { display: flex; justify-content: center; gap: 8px; margin-bottom: 1rem; }
    .heart { font-size: 20px; animation: heartbeat 1.2s ease-in-out infinite; }
    .heart:nth-child(2) { animation-delay: 0.2s; }
    .heart:nth-child(3) { animation-delay: 0.4s; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
    .loading-text { font-size: 13px; color: var(--text-muted); }
    .timer-bar-wrap { height: 3px; background: var(--bg-surface); border-radius: 2px; margin-top: 1rem; overflow: hidden; }
    .timer-bar { height: 100%; background: var(--pink); width: 0%; border-radius: 2px; transition: width 0.3s linear; }

    /* ── RESULT CARD ── */
    .result-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 0.5px solid var(--border);
    }
    .result-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .result-meta { font-size: 12px; color: var(--text-hint); }
    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      white-space: nowrap;
      background: rgba(232,115,154,0.1);
      color: var(--pink);
      border: 0.5px solid rgba(232,115,154,0.2);
      flex-shrink: 0;
    }
    .course-steps { list-style: none; }
    .step {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--dark);
      color: white;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .step-content { flex: 1; min-width: 0; }
    .step-time { font-size: 10px; color: var(--pink); font-weight: 500; margin-bottom: 3px; }
    .step-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
    .step-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .step-tip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      border: 0.5px solid var(--amber-border);
    }
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 0.5px solid var(--border);
    }
    .summary-item {
      background: var(--bg-surface);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
    }
    .summary-label { font-size: 10px; color: var(--text-hint); margin-bottom: 4px; }
    .summary-val { font-size: 14px; font-weight: 500; color: var(--text); }
    .action-row { display: flex; gap: 8px; margin-top: 1rem; }
    .action-btn {
      flex: 1;
      padding: 9px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: all 0.18s;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-outline {
      background: transparent;
      border: 0.5px solid var(--border-md);
      color: var(--text-muted);
    }
    .btn-outline:hover { background: var(--bg-surface); }
    .btn-dark { background: var(--dark); border: none; color: white; }
    .btn-dark:hover { background: var(--dark-hover); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 12px;
      color: var(--text-hint);
      border-top: 0.5px solid var(--border);
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-tag">✦ date planner</div>
    <h1>3분 안에<br>완성되는 <span>데이트 코스</span></h1>
    <p>지역과 분위기만 선택하면 끝</p>
    <div class="timer-badge">
      ⏱ 3분 이내 맞춤 코스 완성
    </div>
  </header>

  <!-- 광고 슬롯 (상단) -->
  <div class="ad-slot">
    <!-- AdSense 광고 단위: Publisher ID 입력 후 아래 주석 해제하세요 -->
    <!--
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
    <div class="ad-slot-inner">광고 영역 (AdSense 설정 후 활성화)</div>
  </div>

  <!-- MAIN -->
  <main class="main">

    <p class="section-label">지역 선택</p>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="regionSearch" placeholder="지역 검색 (예: 서울, 부산, Jeju...)" oninput="filterRegions(this.value)" autocomplete="off" />
    </div>

    <div class="selected-tag" id="selectedRegionTag">
      <div class="selected-tag-inner">
        📍 <span id="selectedRegionName"></span>
        <button onclick="clearRegion()" aria-label="선택 해제">×</button>
      </div>
    </div>

    <div class="region-grid" id="regionGrid"></div>

    <div class="options-row">
      <div class="option-group">
        <label for="season">계절 / 시간대</label>
        <select id="season">
          <option>🌸 봄 (낮)</option>
          <option>☀️ 여름 (낮)</option>
          <option>🍂 가을 (낮)</option>
          <option>❄️ 겨울 (낮)</option>
          <option>🌙 봄 (저녁)</option>
          <option>🌙 여름 (저녁)</option>
          <option>🌙 가을 (저녁)</option>
          <option>🌙 겨울 (저녁)</option>
        </select>
      </div>
      <div class="option-group">
        <label for="budget">예산</label>
        <select id="budget">
          <option>💚 가성비 (1~3만원)</option>
          <option>💛 적당히 (3~7만원)</option>
          <option>💗 특별하게 (7만원+)</option>
        </select>
      </div>
    </div>

    <p class="section-label">분위기</p>
    <div class="vibe-row">
      <button class="vibe-chip" onclick="toggleVibe(this)">🌿 자연/힐링</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">🎨 문화/예술</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">🍽️ 맛집/카페</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">🎢 액티비티</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">🌃 야경/로맨틱</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">🛍️ 쇼핑</button>
      <button class="vibe-chip" onclick="toggleVibe(this)">📸 인생사진</button>
    </div>

    <button class="generate-btn" id="genBtn" onclick="generateCourse()">
      ✨ 데이트 코스 생성하기
    </button>

    <!-- 로딩 -->
    <div class="loading-state" id="loading">
      <div class="pulse-hearts">
        <span class="heart">🤍</span><span class="heart">💗</span><span class="heart">🤍</span>
      </div>
      <div class="loading-text" id="loadingText">완벽한 코스를 구성하는 중...</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    </div>

    <!-- 결과 카드 -->
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <div>
          <div class="result-title" id="courseTitle"></div>
          <div class="result-meta" id="courseMeta"></div>
        </div>
        <span class="result-badge">💗 <span id="vibeTag"></span></span>
      </div>
      <ul class="course-steps" id="courseSteps"></ul>
      <div class="summary-row">
        <div class="summary-item"><div class="summary-label">총 시간</div><div class="summary-val" id="totalTime"></div></div>
        <div class="summary-item"><div class="summary-label">예상 비용</div><div class="summary-val" id="totalCost"></div></div>
        <div class="summary-item"><div class="summary-label">이동 수단</div><div class="summary-val" id="transport"></div></div>
      </div>
      <div class="action-row">
        <button class="action-btn btn-outline" onclick="generateCourse()">🔄 다른 코스 보기</button>
        <button class="action-btn btn-dark" onclick="shareCourse()">📤 공유하기</button>
      </div>
    </div>

    <!-- 광고 슬롯 (결과 하단) -->
    <div style="margin-top: 1.5rem;">
      <!-- AdSense 광고 단위 -->
      <!--
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
      <div class="ad-slot-inner">광고 영역 (AdSense 설정 후 활성화)</div>
    </div>

  </main>

  <footer>
    © 2026 3분 데이트 코스 플래너 · 전국 데이트 명소 큐레이션
  </footer>

  <script>
    const ALL_REGIONS = [
      { name: '서울', emoji: '🗼', sub: 'Seoul' },
      { name: '부산', emoji: '🌊', sub: 'Busan' },
      { name: '제주', emoji: '🌺', sub: 'Jeju' },
      { name: '경주', emoji: '🏯', sub: 'Gyeongju' },
      { name: '강릉', emoji: '🌊', sub: 'Gangneung' },
      { name: '전주', emoji: '🏘️', sub: 'Jeonju' },
      { name: '인천', emoji: '⚓', sub: 'Incheon' },
      { name: '대구', emoji: '🌸', sub: 'Daegu' },
      { name: '춘천', emoji: '🌿', sub: 'Chuncheon' },

        { time: "05:00 PM", name: "동성로 쇼핑", desc: "대구의 명동 동성로에서 쇼핑과 카페 구경. 아기자기한 소품샵과 카페들이 가득.", tip: "봉리단길도 인근에 있어요" },
        { time: "07:00 PM", name: "83타워 야경", desc: "대구를 한눈에 내려다보는 전망대. 야경이 시작되는 저녁 타이밍에 올라가면 최고.", tip: "스카이라운지 음료와 함께 여유롭게" },
      ]}],
      "춘천": [{ title: "춘천 호수 & 닭갈비 로맨틱 코스", vibeTag: "자연/힐링", totalTime: "6시간", totalCost: "3~5만원", transport: "차량/도보", steps: [
        { time: "10:00 AM", name: "의암호 스카이워크", desc: "호수 위를 걷는 유리 전망대. 투명한 발밑으로 보이는 호수가 스릴과 낭만을 동시에 선사.", tip: "등산화 신으면 안 들어가요" },
        { time: "12:00 PM", name: "소양강 스카이워크 & 강변", desc: "춘천 소양강을 따라 여유로운 산책. 강바람 맞으며 드라이브하기 좋은 호반의 도시.", tip: "소양강 댐 투어도 가능" },
        { time: "02:00 PM", name: "남이섬 나들이", desc: "사계절 내내 다른 매력을 보여주는 낭만의 섬. 자전거 타며 메타세쿼이아 길을 달려요.", tip: "연인들의 자물쇠 명소도 있어요" },
        { time: "04:30 PM", name: "춘천 카페거리 커피", desc: "소양강변 근처 감성 카페에서 호수 뷰를 바라보며 티타임.", tip: "핫초코가 유독 맛있는 카페 많아요" },
        { time: "06:30 PM", name: "닭갈비 골목 저녁", desc: "춘천의 자존심 막국수와 닭갈비! 숯불 닭갈비와 함께하는 완벽한 여행 마무리.", tip: "볶음밥까지 해먹어야 제맛" },
      ]}],
      "여수": [{ title: "여수 밤바다 낭만 코스", vibeTag: "야경/로맨틱", totalTime: "6시간", totalCost: "4~7만원", transport: "도보/버스", steps: [
        { time: "03:00 PM", name: "오동도 산책", desc: "동백꽃이 아름다운 여수의 섬. 모노레일 타고 섬 한 바퀴 돌며 여유로운 오후 시작.", tip: "동백꽃 철(12~3월)이면 장관" },
        { time: "05:00 PM", name: "여수 해상케이블카", desc: "바다 위를 나는 케이블카에서 바라보는 여수 전경. 크리스탈 캐빈으로 발밑 바다 뷰 추천.", tip: "해질녘 탑승하면 노을과 야경 모두 OK" },
        { time: "07:00 PM", name: "낭만포차거리 저녁", desc: "여수 밤바다 바로 옆 포차거리에서 새조개, 돌문어 등 여수 특산 해산물 즐기기.", tip: "새조개 샤브샤브가 여수 대표 메뉴" },
        { time: "09:00 PM", name: "이순신광장 야경", desc: "이순신 장군 동상과 거북선 배경의 야경. 여수 밤바다가 눈앞에 펼쳐지는 낭만 마무리.", tip: "야간 조명 켜지는 시간 맞춰 방문" },
      ]}],
      "통영": [{ title: "통영 한려수도 힐링 코스", vibeTag: "자연/힐링", totalTime: "7시간", totalCost: "4~6만원", transport: "케이블카/도보", steps: [
        { time: "10:00 AM", name: "통영 케이블카", desc: "미륵산 정상까지 케이블카로 올라 한려수도 절경 감상.", tip: "맑은 날 일본까지 보인다고 해요" },
        { time: "12:30 PM", name: "중앙시장 충무김밥", desc: "통영 원조 충무김밥 골목에서 점심. 꼴뚜기 무침과 깍두기 곁들인 한 끼가 최고.", tip: "새벽부터 줄 서는 집이 진짜" },
        { time: "02:00 PM", name: "동피랑 벽화마을", desc: "알록달록 벽화와 한려수도 뷰가 어우러진 포토 명소.", tip: "뷰포인트에서 다도해 전경 꼭 사진 찍기" },
        { time: "04:00 PM", name: "달아공원 일몰", desc: "한려수도 최고의 일몰 명소. 수십 개 섬 사이로 지는 노을이 환상적.", tip: "해지기 30분 전에 도착하세요" },
        { time: "06:30 PM", name: "서호시장 해산물 저녁", desc: "싱싱한 굴, 멍게, 해삼 등 통영 해산물을 저렴하게.", tip: "굴구이, 멍게비빔밥이 시그니처" },
      ]}],
      "속초": [{ title: "속초 바다 & 산 힐링 코스", vibeTag: "자연/힐링", totalTime: "7시간", totalCost: "4~6만원", transport: "차량/도보", steps: [
        { time: "09:00 AM", name: "설악산 울산바위 트레킹", desc: "웅장한 바위 절경을 자랑하는 울산바위 코스. 케이블카로 올라 정상 뷰 감상.", tip: "케이블카 예매는 미리 해두세요" },
        { time: "12:30 PM", name: "속초 중앙시장 닭강정", desc: "전국 3대 닭강정 명소 속초 중앙시장에서 점심.", tip: "만석닭강정, 88닭강정이 유명" },
        { time: "02:30 PM", name: "청초호 산책", desc: "속초 시내 한가운데 자리한 청초호. 호수를 끼고 이어진 산책로에서 여유로운 오후.", tip: "엑스포타워에서 속초 전경도 감상 가능" },
        { time: "04:30 PM", name: "영금정 & 속초해수욕장", desc: "바다와 바위가 어우러진 영금정 뷰포인트. 속초해변에서 발 담그며 여유로운 시간.", tip: "영금정 일출도 유명하니 숙박하면 추천" },
        { time: "06:30 PM", name: "동명항 대게 & 해산물", desc: "동명항에서 싱싱한 대게와 해산물로 여행 마무리.", tip: "홍게가 대게보다 가성비 좋아요" },
      ]}],
    };

    const DEFAULT_COURSE = {
      vibeTag: "로맨틱", totalTime: "6시간", totalCost: "4~6만원", transport: "대중교통",
      steps: [
        { time: "10:00 AM", name: "지역 명소 탐방", desc: "선택한 지역의 대표 명소를 함께 둘러보며 여행 시작.", tip: "미리 지도 앱으로 동선 확인하세요" },
        { time: "12:30 PM", name: "지역 맛집 점심", desc: "그 지역에서만 먹을 수 있는 향토 음식으로 점심 식사.", tip: "현지인 추천 맛집 검색 추천" },
        { time: "02:30 PM", name: "카페 & 산책", desc: "분위기 좋은 카페에서 커피 한 잔 후 주변 산책.", tip: "여유롭게 골목 탐험도 추천" },
        { time: "05:00 PM", name: "뷰포인트 선셋", desc: "지역의 대표 뷰포인트에서 석양 감상.", tip: "해지기 전 미리 도착하면 좋아요" },
        { time: "07:00 PM", name: "저녁 & 마무리", desc: "분위기 있는 레스토랑에서 여행의 마무리를 함께.", tip: "예약하면 더 편리해요" },
      ]
    };

    let selectedRegion = null;

    function renderRegions(list) {
      const grid = document.getElementById('regionGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div class="no-result">🗺️<br>검색 결과가 없어요</div>';
        return;
      }
      list.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'region-btn' + (selectedRegion === r.name ? ' active' : '');
        btn.dataset.region = r.name;
        btn.innerHTML = `<span class="r-emoji">${r.emoji}</span><span class="r-name">${r.name}</span><span class="r-sub">${r.sub}</span>`;
        btn.onclick = () => selectRegion(btn, r.name);
        grid.appendChild(btn);
      });
    }

    function filterRegions(q) {
      const query = q.trim();
      const filtered = query === ''
        ? ALL_REGIONS
        : ALL_REGIONS.filter(r => r.name.includes(query) || r.sub.toLowerCase().includes(query.toLowerCase()));
      renderRegions(filtered);
    }

    function selectRegion(btn, name) {
      selectedRegion = name;
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selectedRegionName').textContent = name;
      document.getElementById('selectedRegionTag').style.display = 'block';
      document.getElementById('regionSearch').value = '';
      renderRegions(ALL_REGIONS);
      document.querySelectorAll('.region-btn').forEach(b => {
        if (b.dataset.region === name) b.classList.add('active');
      });
    }

    function clearRegion() {
      selectedRegion = null;
      document.getElementById('selectedRegionTag').style.display = 'none';
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
    }

    function toggleVibe(chip) {
      document.querySelectorAll('.vibe-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    }

    function generateCourse() {
      if (!selectedRegion) {
        selectedRegion = '서울';
        document.getElementById('selectedRegionName').textContent = '서울';
        document.getElementById('selectedRegionTag').style.display = 'block';
        renderRegions(ALL_REGIONS);
        document.querySelectorAll('.region-btn').forEach(b => {
          if (b.dataset.region === '서울') b.classList.add('active');
        });
      }
      document.getElementById('resultCard').classList.remove('visible');
      document.getElementById('loading').classList.add('visible');
      document.getElementById('genBtn').disabled = true;
      document.getElementById('timerBar').style.width = '0%';

      const texts = ['완벽한 코스를 구성하는 중...', '주변 맛집과 명소 검색 중...', '최적의 동선으로 정리하는 중...', '설레는 코스 완성!'];
      let progress = 0, textIdx = 0;
      const iv = setInterval(() => {
        progress += 2;
        document.getElementById('timerBar').style.width = progress + '%';
        if (progress % 25 === 0 && textIdx < texts.length - 1) {
          document.getElementById('loadingText').textContent = texts[++textIdx];
        }
        if (progress >= 100) { clearInterval(iv); setTimeout(showResult, 300); }
      }, 30);
    }

    function showResult() {
      const region = selectedRegion || '서울';
      const courses = COURSES[region];
      const course = courses
        ? courses[Math.floor(Math.random() * courses.length)]
        : { ...DEFAULT_COURSE, title: `${region} 데이트 코스` };

      const season = document.getElementById('season').value;
      document.getElementById('courseTitle').textContent = course.title;
      document.getElementById('courseMeta').textContent = `${region} · ${season.includes('저녁') ? '저녁' : '낮'} 코스 · 약 ${course.totalTime}`;
      document.getElementById('vibeTag').textContent = course.vibeTag;
      document.getElementById('totalTime').textContent = course.totalTime;
      document.getElementById('totalCost').textContent = course.totalCost;
      document.getElementById('transport').textContent = course.transport;

      const list = document.getElementById('courseSteps');
      list.innerHTML = '';
      course.steps.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'step';
        li.innerHTML = `
          <div class="step-num">${i + 1}</div>
          <div class="step-content">
            <div class="step-time">${s.time}</div>
            <div class="step-name">${s.name}</div>
            <div class="step-desc">${s.desc}</div>
            <div class="step-tip">💡 ${s.tip}</div>
          </div>`;
        list.appendChild(li);
      });

      document.getElementById('loading').classList.remove('visible');
      document.getElementById('resultCard').classList.add('visible');
      document.getElementById('genBtn').disabled = false;
      document.getElementById('timerBar').style.width = '0%';
    }

    function shareCourse() {
      if (navigator.share) {
        navigator.share({ title: '3분 데이트 코스', text: `${selectedRegion} 데이트 코스를 확인해보세요!`, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => alert('링크가 복사되었습니다! 💗'));
      }
    }

    renderRegions(ALL_REGIONS);
  </script>
</body>
